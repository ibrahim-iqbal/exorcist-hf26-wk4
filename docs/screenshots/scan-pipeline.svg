<rect class="box gray" x="200" y="256" width="110" height="44"/>
<text class="title" x="255" y="278" text-anchor="middle" dominant-baseline="central">Dead</text>

<rect class="box gray" x="320" y="256" width="110" height="44"/>
<text class="title" x="375" y="278" text-anchor="middle" dominant-baseline="central">Dormant</text>

<rect class="box gray" x="440" y="256" width="110" height="44"/>
