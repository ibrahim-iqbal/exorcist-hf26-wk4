<text class="sub" x="282" y="72" text-anchor="middle" dominant-baseline="central">EmbeddingGemma</text>
<line x1="352" y1="58" x2="392" y2="58" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="394" y="30" width="140" height="56"/>
<text class="title t-teal" x="464" y="54" text-anchor="middle" dominant-baseline="central">npm metadata</text>
<text class="sub" x="464" y="72" text-anchor="middle" dominant-baseline="central">Concurrency 6</text>
<line x1="534" y1="58" x2="555" y2="58" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="557" y="30" width="100" height="56"/>
