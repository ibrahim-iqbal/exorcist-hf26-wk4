<text class="sub" x="560" y="278" text-anchor="start" dominant-baseline="central">needs registry</text>
<text class="sub" x="490" y="338" text-anchor="start" dominant-baseline="central">needs embeddings</text>

<line x1="340" y1="412" x2="340" y2="450" class="arr" marker-end="url(#arrow)"/>

<rect class="box amber" x="220" y="452" width="240" height="56"/>
<text class="title t-amber" x="340" y="476" text-anchor="middle" dominant-baseline="central">Health score</text>
<text class="sub" x="340" y="494" text-anchor="middle" dominant-baseline="central">0–100, category-capped</text>
</svg>