<text class="sub" x="607" y="72" text-anchor="middle" dominant-baseline="central">Size data</text>

<line x1="282" y1="86" x2="282" y2="120" class="arr" marker-end="url(#arrow)"/>

<rect class="box purple" x="180" y="122" width="204" height="56"/>
<text class="title t-purple" x="282" y="146" text-anchor="middle" dominant-baseline="central">Embed descriptions</text>
<text class="sub" x="282" y="164" text-anchor="middle" dominant-baseline="central">256-dim vectors</text>

<line x1="340" y1="150" x2="340" y2="210" class="arr" marker-end="url(#arrow)"/>
<line x1="464" y1="86" x2="464" y2="210" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="607" y1="86" x2="540" y2="210" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<rect class="box coral" x="40" y="212" width="600" height="200" rx="16"/>
