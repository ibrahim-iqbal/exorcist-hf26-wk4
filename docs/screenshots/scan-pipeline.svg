<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="background:#1a1a2e">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e8e0d0; }
  .title { font-size: 14px; font-weight: 600; }
  .sub { font-size: 12px; fill: #b8b0a0; }
  .box { rx: 8; stroke-width: 0.5; }
  .arr { stroke: #b8b0a0; stroke-width: 1.5; }
  .purple { fill: #2d2640; stroke: #7F77DD; }
  .teal { fill: #0d2e28; stroke: #5DCAA5; }
  .coral { fill: #2a1510; stroke: #F0997B; }
  .amber { fill: #2a1e08; stroke: #EF9F27; }
  .gray { fill: #1e1e1e; stroke: #888780; }
  .pink { fill: #2a1520; stroke: #ED93B1; }
  .t-purple { fill: #AFA9EC; }
  .t-teal { fill: #9FE1CB; }
  .t-coral { fill: #F5C4B3; }
  .t-amber { fill: #FAC775; }
  .t-pink { fill: #F4C0D1; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b8b0a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box gray" x="40" y="30" width="130" height="56"/>
<text class="title" x="105" y="54" text-anchor="middle" dominant-baseline="central">Parse</text>
<text class="sub" x="105" y="72" text-anchor="middle" dominant-baseline="central">Validate JSON</text>
<line x1="170" y1="58" x2="210" y2="58" class="arr" marker-end="url(#arrow)"/>

<rect class="box purple" x="212" y="30" width="140" height="56"/>
