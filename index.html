<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0908" />
    <title>Exorcist — exorcism for your package.json</title>
    <meta name="description" content="Drop in a package.json. Exorcist finds dead, cursed, duplicated, outdated, bloated and dormant dependencies, and suggests lighter ones. Runs entirely in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Exorcist — exorcism for your package.json" />
    <meta property="og:description" content="Find the dead, cursed and bloated spirits haunting your dependencies. Runs entirely in your browser." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      try {
        var t = localStorage.getItem('exorcist-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
